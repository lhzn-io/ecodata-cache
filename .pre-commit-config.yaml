repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500000"]
      - id: check-toml
      - id: detect-private-key

  # Pinned deliberately. This rev is the authoritative linter version for the
  # repo; CI runs these same hooks so there is one standard everywhere. Bump it
  # as its own reviewed change, never implicitly. The rule selection is pinned
  # alongside it in pyproject.toml [tool.ruff.lint], because ruff's built-in
  # defaults are not stable across versions.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        require_serial: true
        args: ["--ignore-missing-imports", "--explicit-package-bases"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        language_version: 20.10.0
        args: ["--fix"]

  - repo: local
    hooks:
      - id: block-cds-secrets
        name: Block Copernicus Secrets
        entry: 'url: https://cds.climate.copernicus.eu'
        language: pygrep
        files: \.jl$|\.py$|\.env$|\.cdsapirc$
