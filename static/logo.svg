<svg viewBox="40 40 120 120" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(100, 100)">
        <!-- Grid Bottom -->
        <path d="M0,0 L50,25 L0,50 L-50,25 Z" fill="none" stroke="#233d5a" stroke-width="2" />
        <path d="M-25,12.5 L25,37.5 M-25,37.5 L25,12.5" stroke="#233d5a" stroke-width="1" />
        <!-- Grid Top -->
        <path d="M0,-40 L50,-15 L0,10 L-50,-15 Z" fill="none" stroke="#2b5f5f" stroke-width="2" stroke-dasharray="4,2" />
        <path d="M-25,-27.5 L25,-2.5 M-25,-2.5 L25,-27.5" stroke="#2b5f5f" stroke-width="1" stroke-dasharray="2,2" />
        <!-- Water Currents (Navy/Blue) -->
        <path d="M-25,37.5 L-10,30" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
        <path d="M0,50 L15,42.5" stroke="#58a6ff" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
        <!-- Wind Quivers (Teal/Cyan) -->
        <path d="M-25,-2.5 L-5,-5" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
        <path d="M0,10 L20,7.5" stroke="#3fb950" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

        <!-- Connections representing caching nodes -->
        <line x1="0" y1="10" x2="0" y2="50" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2" />
        <line x1="-50" y1="-15" x2="-50" y2="25" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2" />
        <line x1="50" y1="-15" x2="50" y2="25" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2" />
    </g>
    <defs>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950" />
        </marker>
    </defs>
</svg>
