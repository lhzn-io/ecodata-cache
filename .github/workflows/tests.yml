name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      # Advisory, not gating. pre-commit lints only the files a commit touches,
      # so the repo carries pre-existing drift (1 ruff finding, 7 files ruff
      # format would rewrite as of 2026-09-22). Failing on that would block
      # unrelated work; the report stays visible here until the debt is paid,
      # then this becomes blocking.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Integration tests are excluded: they call live NOAA, ECMWF CDS and HYCOM
      # endpoints, take roughly 10 minutes, and some need CDS credentials.
      # Run them locally or via workflow_dispatch.
      - name: Unit tests
        run: uv run python -m pytest tests/unit -m "not integration" --durations=10
