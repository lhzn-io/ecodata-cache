name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Integration tests are excluded: they call live NOAA, ECMWF CDS and HYCOM
      # endpoints, take roughly 10 minutes, and some need CDS credentials.
      # Run them locally or via workflow_dispatch.
      - name: Unit tests
        run: uv run python -m pytest tests/unit -m "not integration" --durations=10
